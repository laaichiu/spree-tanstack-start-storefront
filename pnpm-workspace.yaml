# Project-level pnpm settings. The root storefront is the only package.
packages: []

allowBuilds:
  '@pnpm/exe': true
  esbuild: true
  lightningcss: true
  sharp: false
  unrs-resolver: false
  workerd: true

minimumReleaseAgeExclude:
  - brace-expansion@5.0.7
  - shell-quote@1.8.5
  - '@hookform/resolvers@5.9.2'
  - '@tanstack/query-core@5.104.4'
  - '@tanstack/react-query@5.104.4'
  - '@spree/sdk@6.0.1'

overrides:
  baseline-browser-mapping: 2.11.0
  browserslist: 4.28.7
  js-yaml: 4.3.2
  nanoid: 3.3.18
  undici: 7.29.0
